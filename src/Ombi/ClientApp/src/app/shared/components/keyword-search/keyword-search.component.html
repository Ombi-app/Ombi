<mat-form-field class="example-chip-list"  appearance="outline" floatLabel=auto>
  <mat-label>{{ "Filter.Keywords" | translate }}</mat-label>
  <mat-chip-grid #chipList aria-label="Fruit selection">
    <mat-chip-row
      *ngFor="let word of form.controls.keywordIds.value"
      (removed)="remove(word)">
      {{word.name}}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip-row>
  </mat-chip-grid>
  <input
    [placeholder]="'Search.SearchKeyword' | translate"
    #keywordInput
    [formControl]="control"
    [matAutocomplete]="auto"
    [matChipInputFor]="chipList"/>
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
    <mat-option *ngFor="let word of filteredKeywords | async" [value]="word">
      {{word.name}}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
